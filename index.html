<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d2089">
<link rel="icon" href="logo.png">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js">
<title>동화IN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 모바일 앱 한 열(최대 480px), 위 고정 헤더 + 아래 탭바 + 오른쪽 아래 등록 버튼 */
:root {
  --navy: #1d2089;          /* 동화고 로고 남색 */
  --gold: #e2ac3f;          /* 로고 가운데 금색 */
  --brand: #1d2089;
  --brand-ink: #ffffff;
  --brand-soft: #eceefb;
  --gold-soft: #fbf2de;
  --gold-ink: #7a5408;
  --bg: #e9eaf2;
  --surface: #ffffff;
  --surface-2: #f4f5f9;
  --line: #e3e4ec;
  --fg: #16172b;
  --fg-2: #5b5d72;
  --fg-3: #8f91a3;
  --danger: #c8352e;
  --read: #b98207;          /* 안 읽음 '1' */
  --ok: #1f7a4d;
  --ok-soft: #e3f3ea;
  --shadow: 0 8px 28px rgba(22, 23, 60, .14);
  --font-body: "IBM Plex Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --font-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand: #7c83f5; --brand-ink: #0d0e24; --brand-soft: #22244a;
    --gold-soft: #3a2f17; --gold-ink: #f2cd7d;
    --bg: #0b0c16; --surface: #14152a; --surface-2: #1d1f38; --line: #2a2c48;
    --fg: #eceefa; --fg-2: #a9abc4; --fg-3: #74768f;
    --danger: #ff7a70; --ok: #6fd3a0; --ok-soft: #173326; --read: #f2c35a;
    --shadow: 0 8px 28px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand: #7c83f5; --brand-ink: #0d0e24; --brand-soft: #22244a;
  --gold-soft: #3a2f17; --gold-ink: #f2cd7d;
  --bg: #0b0c16; --surface: #14152a; --surface-2: #1d1f38; --line: #2a2c48;
  --fg: #eceefa; --fg-2: #a9abc4; --fg-3: #74768f;
  --danger: #ff7a70; --ok: #6fd3a0; --ok-soft: #173326; --read: #f2c35a;
  --shadow: 0 8px 28px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { position: relative; max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--surface); padding-bottom: 76px; }
.app.no-tabs { padding-bottom: 92px; }
.app.chat-mode { padding-bottom: 0; }
.view { min-height: 100%; }

/* ---------- 헤더 ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 12px 0 16px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; }
.brand img { width: 30px; height: 30px; border-radius: 50%; }
.brand b { font-family: var(--font-display); font-size: 21px; letter-spacing: -.5px; color: var(--fg); }
.brand b span { color: var(--gold); font-family: var(--font-body); font-weight: 700; letter-spacing: .5px; margin-left: 2px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; color: var(--fg-2); position: relative; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.small { width: 30px; height: 30px; }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.small svg { width: 18px; height: 18px; }
.icon-btn .dot { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.title-bar { gap: 4px; padding-left: 6px; }
.title-bar h1 { font-size: 17px; font-weight: 700; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 홈 ---------- */
.home-tools { padding: 12px 16px 4px; display: grid; gap: 10px; }
.search { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 12px; background: var(--surface-2); color: var(--fg-3); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; color: var(--fg); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips.sub .chip { height: 28px; font-size: 12.5px; padding: 0 11px; }
.cat-tag { color: var(--fg-2); text-decoration: underline; text-underline-offset: 3px; }
.deal-row .role { font-size: 11.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; margin-right: 4px; }
.deal-row .role.sell { background: var(--brand-soft); color: var(--brand); }
.deal-row .role.buy { background: var(--gold-soft); color: var(--gold-ink); }
.deal-row .amt { font-weight: 700; flex: none; text-align: right; font-size: 14px; }
.deal-row .amt small { display: block; font-weight: 400; color: var(--fg-3); font-size: 12px; }
.chip { flex: none; height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-2); font-size: 13.5px; font-weight: 500; }
.chip.on { background: var(--fg); border-color: var(--fg); color: var(--surface); }
.notice-strip { margin: 8px 16px 0; padding: 10px 12px; border-radius: 12px; background: var(--gold-soft); color: var(--gold-ink); font-size: 13px; display: flex; gap: 8px; align-items: flex-start; }
.notice-strip button { margin-left: auto; font-weight: 600; text-decoration: underline; color: inherit; flex: none; }
.list { list-style: none; margin: 0; padding: 0 16px; }
.row { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row.faded { opacity: .55; }
.thumb { flex: none; width: 104px; height: 104px; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row-title { font-size: 15.5px; margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-meta { font-size: 12.5px; color: var(--fg-3); margin-top: 2px; }
.row-price { margin-top: 4px; display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15.5px; }
.row-foot { margin-top: auto; align-self: flex-end; display: flex; gap: 10px; color: var(--fg-3); font-size: 12.5px; }
.row-foot span { display: inline-flex; align-items: center; gap: 3px; }
.row-foot svg { width: 14px; height: 14px; }
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; flex: none; }
.pill.reserved { background: var(--ok-soft); color: var(--ok); }
.pill.done { background: var(--surface-2); color: var(--fg-2); }
.pill.free { background: var(--gold-soft); color: var(--gold-ink); }
.empty { padding: 56px 24px; text-align: center; color: var(--fg-3); }
.empty b { display: block; font-family: var(--font-display); font-size: 20px; color: var(--fg); margin-bottom: 6px; }

/* 사진 없는 물건 표지 */
.cover { width: 100%; height: 100%; position: relative; display: flex; align-items: flex-end; padding: 10px 10px 10px 18px; color: #fff; font-family: var(--font-display); font-size: 13px; line-height: 1.3; word-break: keep-all; }
.cover::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 3px; background: rgba(255, 255, 255, .28); }
.cover::after { content: ""; position: absolute; right: 10px; top: 10px; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); opacity: .9; }
.mini .cover { font-size: 0; padding: 0; }
.mini .cover::before { left: 4px; width: 2px; }
.mini .cover::after { width: 9px; height: 9px; right: 5px; top: 5px; }
.cover.big { font-size: 26px; padding: 28px 28px 32px 40px; }
.cover.big::before { left: 18px; width: 5px; }
.cover.big::after { width: 34px; height: 34px; right: 24px; top: 24px; }

/* ---------- 탭바 & FAB ---------- */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(480px, 100%); z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tab { height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; color: var(--fg-3); position: relative; }
.tab svg { width: 23px; height: 23px; }
.tab.on { color: var(--fg); font-weight: 600; }
.tab .badge { position: absolute; top: 7px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--danger); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.fab { position: fixed; z-index: 31; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); right: max(16px, calc(50% - 240px + 16px)); height: 50px; padding: 0 20px 0 16px; border-radius: 25px; background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; gap: 6px; font-weight: 700; box-shadow: var(--shadow); }
.fab svg { width: 22px; height: 22px; }
.fab:active { transform: scale(.97); }

/* ---------- 폼 (등록) ---------- */
.form { padding: 20px 16px 24px; display: grid; gap: 24px; }
.field { display: grid; gap: 8px; }
.field > label, .field > .label { font-weight: 700; font-size: 15.5px; }
.field small { color: var(--fg-3); font-size: 12.5px; }
.input, .textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 13px 14px; outline: none; }
.input:focus, .textarea:focus { border-color: var(--fg-2); }
.textarea { min-height: 150px; resize: vertical; line-height: 1.6; }
.input::placeholder, .textarea::placeholder { color: var(--fg-3); }
.input:disabled { background: var(--surface-2); color: var(--fg-3); }
.price-wrap { position: relative; }
.price-wrap .input { padding-left: 34px; }
.price-wrap::before { content: "₩"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--fg-3); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photos { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; }
.ph-add { flex: none; width: 82px; height: 82px; border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--fg-2); font-size: 13px; background: var(--surface); }
.ph-add svg { width: 26px; height: 26px; color: var(--fg-3); }
.ph { flex: none; width: 82px; height: 82px; border-radius: 14px; position: relative; overflow: hidden; background: var(--surface-2); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph .rm { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0, 0, 0, .6); color: #fff; display: grid; place-items: center; }
.ph .rm svg { width: 13px; height: 13px; }
.ph .lead { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, .55); color: #fff; font-size: 11px; text-align: center; padding: 2px 0; }
.err { color: var(--danger); font-size: 13px; }
.bottom-cta { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(480px, 100%); z-index: 30; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.btn { height: 52px; border-radius: 14px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 18px; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.gold { background: var(--gold); color: #2a1d00; }
.btn.soft { background: var(--surface-2); color: var(--fg); }
.btn.ghost { border: 1px solid var(--line); color: var(--fg); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 34px; font-size: 13px; border-radius: 9px; padding: 0 11px; }

/* ---------- 상세 ---------- */
.detail-head { position: absolute; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 5; display: flex; justify-content: space-between; padding: 8px; }
.detail-head .icon-btn { background: rgba(0, 0, 0, .32); color: #fff; backdrop-filter: blur(4px); border-radius: 50%; }
.gallery { position: relative; aspect-ratio: 1 / 1; max-width: 100%; background: var(--surface-2); }
.slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; height: 100%; scrollbar-width: none; }
.slides::-webkit-scrollbar { display: none; }
.slides > * { flex: none; width: 100%; height: 100%; scroll-snap-align: start; }
.slides img { object-fit: cover; }
.counter { position: absolute; right: 14px; bottom: 14px; background: rgba(0, 0, 0, .55); color: #fff; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.seller { display: flex; align-items: center; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); }
.avatar { flex: none; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 17px; }
.avatar.sm { width: 36px; height: 36px; font-size: 14px; }
.seller-info { flex: 1; min-width: 0; }
.seller-info b { display: block; }
.seller-info span { color: var(--fg-3); font-size: 13px; }
.review-count { text-align: right; font-size: 12.5px; color: var(--fg-3); }
.review-count b { display: block; color: var(--gold-ink); font-size: 18px; background: var(--gold-soft); border-radius: 8px; padding: 0 8px; }
.detail-body { padding: 20px 16px 8px; }
.detail-body h2 { margin: 0; font-size: 22px; line-height: 1.35; text-wrap: balance; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.detail-price { font-size: 22px; font-weight: 700; margin-top: 8px; }
.detail-meta { color: var(--fg-3); font-size: 13px; margin-top: 6px; }
.desc { margin-top: 18px; white-space: pre-wrap; line-height: 1.75; word-break: break-word; }
.facts { margin: 22px 0 8px; display: grid; gap: 10px; padding: 14px; border-radius: 14px; background: var(--surface-2); font-size: 14px; }
.facts div { display: flex; gap: 10px; }
.facts dt { color: var(--fg-3); width: 74px; flex: none; }
.facts dd { margin: 0; font-weight: 500; min-width: 0; }
.map-link { color: var(--brand); font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; margin-left: 6px; }
.map-box { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); }
.map-box img { display: block; width: 100%; height: auto; }
.map-pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--brand); }
.map-pin svg { width: 28px; height: 28px; fill: var(--surface); }
.map-pin span { background: var(--surface); padding: 1px 6px; border-radius: 6px; box-shadow: var(--shadow); white-space: nowrap; }
.map-pin.on { color: var(--danger); z-index: 2; }
.place-list { display: grid; gap: 6px; }
.place-btn { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); text-align: left; }
.place-btn svg { width: 20px; height: 20px; color: var(--brand); flex: none; }
.place-btn.on { border-color: var(--brand); background: var(--brand-soft); font-weight: 700; }
.report-reasons { display: grid; gap: 6px; }
.banner { margin: 16px 16px 0; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.55; }
.banner.reserved { background: var(--ok-soft); color: var(--ok); }
.banner.done { background: var(--surface-2); color: var(--fg-2); }
.reviews { padding: 8px 16px 20px; }
.reviews h3 { font-size: 16px; margin: 18px 0 8px; }
.review { padding: 12px 0; border-top: 1px solid var(--line); font-size: 14px; }
.review span { display: block; color: var(--fg-3); font-size: 12px; margin-top: 2px; }
.action-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(480px, 100%); z-index: 30; display: flex; align-items: center; gap: 12px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.heart { display: flex; flex-direction: column; align-items: center; color: var(--fg-2); font-size: 11px; width: 44px; flex: none; }
.heart svg { width: 28px; height: 28px; }
.heart.on { color: var(--danger); }
.heart.on svg { fill: currentColor; }
.heart:disabled { opacity: .4; }
.action-bar .btn { flex: 1; }
.bar-note { font-size: 12px; color: var(--fg-3); text-align: center; }

/* ---------- 채팅 목록 ---------- */
.chat-row { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
.chat-row .mid { flex: 1; min-width: 0; }
.chat-row .name { font-weight: 700; }
.chat-row .name small { font-weight: 400; color: var(--fg-3); font-size: 12px; margin-left: 4px; }
.chat-row .last { color: var(--fg-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-row .mini { flex: none; width: 46px; height: 46px; border-radius: 8px; overflow: hidden; }
.chat-row .mini img { width: 100%; height: 100%; object-fit: cover; }
.unread { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); margin-left: 6px; vertical-align: middle; }

/* ---------- 채팅방 ---------- */
.chat-view { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.room-item { display: flex; gap: 10px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.room-item .mini { flex: none; width: 44px; height: 44px; border-radius: 8px; overflow: hidden; }
.room-item .mini img { width: 100%; height: 100%; object-fit: cover; }
.room-item .t { flex: 1; min-width: 0; font-size: 14px; }
.room-item .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.room-actions { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 10px; border-bottom: 1px solid var(--line); }
.deal { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--gold-soft); color: var(--gold-ink); font-size: 13.5px; flex-wrap: wrap; }
.deal svg { width: 18px; height: 18px; flex: none; }
.deal .when { font-weight: 700; flex: 1; min-width: 140px; }
.deal input { border: 1px solid color-mix(in srgb, var(--gold-ink) 30%, transparent); border-radius: 8px; padding: 5px 8px; background: var(--surface); color: var(--fg); font-size: 13px; min-width: 0; }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; background: var(--surface-2); }
.msg { max-width: 76%; display: flex; gap: 6px; align-items: flex-end; }
.msg .bubble { padding: 9px 13px; border-radius: 18px; background: var(--surface); white-space: pre-wrap; word-break: break-word; border: 1px solid var(--line); }
.msg .meta { display: flex; flex-direction: column; align-items: flex-start; flex: none; line-height: 1.25; }
.msg.me .meta { align-items: flex-end; }
.msg .meta b { font-size: 11px; font-weight: 700; color: var(--read); }
.msg time { font-size: 11px; color: var(--fg-3); }
.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg.me .bubble { background: var(--brand); color: var(--brand-ink); border-color: transparent; border-bottom-right-radius: 6px; }
.msg.them .bubble { border-bottom-left-radius: 6px; }
.msg.sys { align-self: center; max-width: 92%; }
.msg.sys .bubble { background: transparent; border: 0; color: var(--fg-2); font-size: 12.5px; text-align: center; padding: 4px 8px; }
.composer { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.composer input { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid var(--line); padding: 0 16px; background: var(--surface-2); outline: none; }
.composer button { width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; }
.composer button svg { width: 20px; height: 20px; }
.composer button:disabled { opacity: .35; }

function josa(word, withB, withoutB) {
  const last = String(word).replace(/[\s)\]}>.!?~]+$/, '').slice(-1);

  let b = null;
  if (c >= 0xAC00 && c <= 0xD7A3) b = (c - 0xAC00) % 28 !== 0;

/* =====================================================================
   저장소 — 시연 모드(localStorage)와 Firebase(Firestore)가 같은 모양
   watch(컬렉션, 콜백, [필드, 값]) / add / set(병합) / del
   ===================================================================== */
function localStore() {
  const KEY = 'dhbook_db_v1';
  const empty = () => ({ items: {}, rooms: {}, messages: {}, reviews: {}, deals: {}, photos: {}, reports: {}, suggestions: {} });
  const load = () => { try { return Object.assign(empty(), JSON.parse(localStorage.getItem(KEY))); } catch { return empty(); } };
  let data = load();
  const subs = new Set();
  const list = (col, f) => Object.entries(data[col] || {}).map(([id, v]) => ({ id, ...v })).filter(d => !f || d[f[0]] === f[1]);
  const emit = col => subs.forEach(s => { if (!col || s.col === col) s.fire(); });
  function commit(mutate, col) {
    const before = JSON.stringify(data);
    mutate();
    try { localStorage.setItem(KEY, JSON.stringify(data)); }
    catch (e) { data = JSON.parse(before); throw new Error('저장 공간이 가득 찼어요. 사진 수를 줄이거나 시연 데이터를 초기화해 주세요.'); }
    emit(col);
  }
  window.addEventListener('storage', e => { if (e.key === KEY) { data = load(); emit(); } });
  return {
    mode: 'local',
    watch(col, cb, f) { const s = { col, fire: () => cb(list(col, f)) }; subs.add(s); setTimeout(s.fire, 0); return () => subs.delete(s); },
    async add(col, d) { const id = newId(); commit(() => { data[col][id] = d; }, col); return id; },
    async set(col, id, d) { commit(() => { data[col][id] = { ...(data[col][id] || {}), ...d }; }, col); },
    async del(col, id) { commit(() => { delete data[col][id]; }, col); },
    async get(col, id) { return data[col]?.[id] || null; },
    async reload() { data = load(); emit(); },
    isEmpty() { return Object.keys(data.items).length === 0; },
    reset() { commit(() => { data = empty(); }); },
    /* 예전 버전에서 넣었던 예시 데이터(demo...) 지우기 */
    purgeDemo() {
      commit(() => {
        const isDemo = (id, v) => /^demo\d/.test(id) || /^demo\d/.test(v.itemId || '') || /^demo\d/.test(v.roomId || '');
        for (const col of Object.keys(data)) for (const [id, v] of Object.entries(data[col])) if (isDemo(id, v)) delete data[col][id];
      });
    }
  };
}

async function firebaseStore(cfg) {
  const V = '10.12.2';
  const appMod = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  /* 학교 와이파이처럼 프록시가 있는 곳에서도 끊기지 않도록 롱폴링 방식 사용 */
  /* 한 번 받은 데이터는 폰에 저장해 두고(다음부터 바로 표시), 바뀐 것만 새로 받음 */
  let db;
  try { db = fs.initializeFirestore(appMod.initializeApp(cfg), { experimentalForceLongPolling: true, localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch (e) { db = fs.getFirestore(); }
  if (cfg.emulatorHost) fs.connectFirestoreEmulator(db, cfg.emulatorHost, 8080); /* 테스트용 */
  const toList = snap => snap.docs.map(d => ({ id: d.id, ...d.data() }));
  const fail = e => toast('서버에 저장하지 못했어요', e.code === 'permission-denied' ? 'Firestore 보안 규칙(테스트 모드 기간)을 확인해 주세요.' : e.message);
  return {
    mode: 'firebase',
    watch(col, cb, f) {
      const ref = f ? fs.query(fs.collection(db, col), fs.where(f[0], '==', f[1])) : fs.collection(db, col);
      return fs.onSnapshot(ref, s => cb(toList(s)), e => toast('연결 오류', e.message));
    },
    /* 서버 응답을 기다리지 않고 바로 화면에 반영 (Firestore가 알아서 서버에 보냄). 실패하면 알림 */
    async add(col, d) { const ref = fs.doc(fs.collection(db, col)); fs.setDoc(ref, d).catch(fail); return ref.id; },
    async set(col, id, d) { fs.setDoc(fs.doc(db, col, id), d, { merge: true }).catch(fail); },
    async del(col, id) { fs.deleteDoc(fs.doc(db, col, id)).catch(fail); },
    async get(col, id) { try { const d = await fs.getDoc(fs.doc(db, col, id)); return d.exists() ? d.data() : null; } catch (e) { return null; } },
    async reload() {},
    isEmpty() { return false; },
    reset() {},
    purgeDemo() {}
  };
}

/* =====================================================================

function toast(title, body = '', onClick) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<img src="logo.png" alt=""><div><b>${esc(title)}</b>${esc(body)}</div>`;
  el.title = '옆으로 밀면 닫혀요';
  let x0 = null, dx = 0, moved = false, timer;
  const close = dir => { el.style.transition = 'transform .18s ease-in, opacity .18s'; el.style.transform = `translateX(${dir * 120}%)`; el.style.opacity = '0'; setTimeout(() => el.remove(), 180); };
  el.addEventListener('pointerdown', e => { x0 = e.clientX; dx = 0; moved = false; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; clearTimeout(timer); });
  el.addEventListener('pointermove', e => { if (x0 == null) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true; el.style.transform = `translateX(${dx}px)`; el.style.opacity = String(1 - Math.min(Math.abs(dx) / 220, .7)); });
  const end = () => { if (x0 == null) return; x0 = null; if (Math.abs(dx) > 70) close(Math.sign(dx)); else { el.style.transition = 'transform .15s, opacity .15s'; el.style.transform = ''; el.style.opacity = ''; timer = setTimeout(() => close(1), 3000); } };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('click', () => { if (moved) return; el.remove(); onClick && onClick(); });
  $('#toasts').prepend(el);
  timer = setTimeout(() => close(1), 4000);
}
function notify(title, body, onClick) {
  toast(title, body, onClick);
  try {
    if ('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') {
      const n = new Notification(title, { body, icon: 'logo.png' });
      n.onclick = () => { window.focus(); onClick && onClick(); };
    }
  } catch {}
}
async function askNotifyPermission() {
  if (!('Notification' in window)) return 'unsupported';
  try { return await Notification.requestPermission(); } catch { return 'denied'; }
}

function onRoomsChanged(rooms) {

      const old = prevRooms.get(r.id);
      if (!r.lastFrom || (old && (old.updatedAt || 0) >= (r.updatedAt || 0)) || r.lastFrom === me.uid || r.lastBy === me.uid) return;
      if (current().name === 'chat' && current().params.id === r.id) return;
      const other = r.sellerUid === me.uid ? r.buyerName : r.sellerName;
      notify(r.lastFrom === 'system' ? r.itemTitle : `${other}님의 메시지`, r.lastMsg || '', () => go('chat', { id: r.id }));

}
/* 거래 약속 10분 전 알림 */
const firedMem = new Set();
function checkDealReminders() {
  const fired = ls.get('dh_fired', {});
  myRooms().forEach(r => {
    if (!r.dealAt) return;
    const key = `${me.uid}|${r.id}|${r.dealAt}`;
    const left = r.dealAt - now();
    if (left <= 10 * 60 * 1000 && left > -60 * 1000 && !fired[key] && !firedMem.has(key)) {
      fired[key] = 1; firedMem.add(key);
      const item = itemById(r.itemId);
      const mins = Math.max(0, Math.round(left / 60000));
      notify(mins > 0 ? `${mins}분 뒤 거래 약속이 있어요` : '지금 거래 약속 시간이에요',
        `${r.itemTitle} · ${item?.place || '약속 장소'} · ${clock(r.dealAt)}`, () => go('chat', { id: r.id }));
    }
  });
  ls.set('dh_fired', fired);
}

const stack = [{ name: 'home', params: {} }];
const current = () => stack[stack.length - 1];
const TABS = ['home', 'chats', 'me'];
function go(name, params = {}) {
  current().y = window.scrollY;
  if (TABS.includes(name)) { stack.length = 0; }
  stack.push({ name, params });
  render(true);
}
function back() {
  if (stack.length > 1) stack.pop(); else stack.splice(0, stack.length, { name: 'home', params: {} });
  render(true); window.scrollTo(0, current().y || 0);
}
const LIVE = new Set(['home', 'chats', 'me', 'detail']);
function render(fresh = false) {
  const v = current();
  const view = $('#view');
  if (!fresh && !LIVE.has(v.name)) { if (v.name === 'chat') updateChat(); return; }
  const y = fresh ? 0 : window.scrollY;
  const focusQ = document.activeElement && document.activeElement.id === 'q' ? document.activeElement.selectionStart : null;
  cleanupChat();
  const app = $('#app');
  app.classList.toggle('no-tabs', !TABS.includes(v.name));

  view.innerHTML = VIEWS[v.name](v.params);

function compress(file, max = 720, q = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('사진을 읽지 못했어요')); };
    img.src = url;
  });
}
function shrink(dataUrl, max, q) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => res(''); img.src = dataUrl;
  });
}
async function onPhotos(e) {
  const files = [...e.target.files].slice(0, 10 - newFormState.photos.length);
  for (const f of files) { try { newFormState.photos.push(await compress(f)); } catch (err) { toast('사진 오류', err.message); } }
  if (e.target.files.length > files.length) toast('사진은 10장까지 올릴 수 있어요');
  e.target.value = ''; drawPhotos();
}
function setupPrice() {

    const over = digits && Number(digits) > MAX_PRICE;
    if (over) digits = String(MAX_PRICE);
    inp.value = digits ? Number(digits).toLocaleString('ko-KR') : '';
    const hint = $('#price-hint');
    hint.textContent = over ? `가격은 최대 ${won(MAX_PRICE)}까지 올릴 수 있어요.` : `최대 ${won(MAX_PRICE)} · 0원을 입력하면 자동으로 나눔으로 바뀌어요.`;
    hint.classList.toggle('err', !!over);
    if (digits === '0') setPriceMode('free');
  });
}
function setPriceMode(mode) {

let chatUnsub = null, chatMsgs = [];
function cleanupChat() { if (chatUnsub) { chatUnsub(); chatUnsub = null; } chatMsgs = []; }
function mountChat({ id }) {
  markRead(id);

  }, ['roomId', id]);

function drawMsgs() {
  const box = $('#msgs'); if (!box) return;
  const room = S.rooms.find(x => x.id === current().params.id) || {};
  const otherUid = room.sellerUid === me.uid ? room.buyerUid : room.sellerUid;
  const otherRead = room['read_' + otherUid] || 0;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.innerHTML = chatMsgs.length ? chatMsgs.map(m => m.from === 'system'
    ? `<div class="msg sys"><div class="bubble">${esc(m.text)}</div></div>`
    : `<div class="msg ${m.from === me.uid ? 'me' : 'them'}"><div class="bubble">${esc(m.text)}</div><span class="meta">${m.from === me.uid && m.at > otherRead ? '<b aria-label="안 읽음">1</b>' : ''}<time>${clock(m.at)}</time></span></div>`).join('')
    : `<div class="msg sys"><div class="bubble">판매자와 1:1 채팅방이에요. 거래 시간과 장소를 정해 보세요.</div></div>`;
  if (atBottom || !box.dataset.init) { box.scrollTop = box.scrollHeight; box.dataset.init = 1; }
}
function updateChat(first = false) {
  const v = current(); if (v.name !== 'chat') return;
  const r = S.rooms.find(x => x.id === v.params.id);
  if (!r) return;
  if (!$('#roomTop')) { render(true); return; }
  const i = itemById(r.itemId) || { id: r.itemId, title: r.itemTitle, price: 0, status: 'done', deleted: true };
  const seller = r.sellerUid === me.uid;
  const withThisBuyer = i.reservedUid === r.buyerUid;
  let actions = '';
  if (!i.deleted) {
    if (seller && i.status === 'selling') actions = `<button class="btn primary sm" data-act="complete:${r.id}">거래완료</button><button class="btn soft sm" data-act="reserve:${r.id}">이 분과 예약하기</button>`;
    if (i.status === 'reserved' && withThisBuyer && (seller || r.buyerUid === me.uid)) {
      actions = (seller ? `<button class="btn primary sm" data-act="complete:${r.id}">거래완료</button>` : '') + `<button class="btn ghost sm" data-act="cancelDeal:${r.id}">예약 취소</button>`;
    }
    if (i.status === 'done' && i.buyerUid === me.uid && !S.reviews.some(x => x.itemId === i.id && x.fromUid === me.uid)) actions = `<button class="btn gold sm" data-act="review:${i.id}">후기 남기기</button>`;
  }
  const pill = i.deleted ? '<span class="pill done">삭제된 글</span>' : i.status === 'reserved' ? '<span class="pill reserved">예약중</span>' : i.status === 'done' ? '<span class="pill done">거래완료</span>' : '';
  const canTalk = !i.deleted && i.status !== 'done' && (seller || i.status === 'selling' || (i.status === 'reserved' && i.reservedUid === me.uid));
  const dealOpen = canTalk && (i.status === 'selling' || withThisBuyer);
  const prevDeal = $('#dealInput'); const draft = prevDeal && prevDeal.dataset.touched ? prevDeal.value : null;
  $('#roomTop').innerHTML = `
    <div class="room-item" ${i.deleted ? '' : `data-act="open:${i.id}" style="cursor:pointer"`}><div class="mini">${cover(i)}</div>
      <div class="t"><b>${esc(i.title)}</b>${pill} ${esc(priceLabel(i.price))}</div></div>
    ${actions ? `<div class="room-actions">${actions}</div>` : ''}
    ${dealOpen || r.dealAt ? `<div class="deal">${I.cal}
      <span class="when">${r.dealAt ? `거래 약속 ${dealLabel(r.dealAt)}` : '거래 날짜를 정했나요?'}</span>
      ${dealOpen ? `<input type="datetime-local" id="dealInput" aria-label="거래 날짜와 시간" value="${r.dealAt ? toLocalInput(r.dealAt) : ''}" min="${toLocalInput(now())}" max="${toLocalInput(now() + MAX_DEAL_DAYS * 864e5)}">
      <button class="btn primary sm" data-act="saveDeal:${r.id}">${r.dealAt ? '변경' : '저장'}</button>` : ''}
    </div>` : ''}`;
  drawMsgs();
  const di = $('#dealInput');
  if (di) { if (draft != null) { di.value = draft; di.dataset.touched = 1; } di.addEventListener('input', () => { di.dataset.touched = 1; }); }
  const slot = $('#composerSlot');
  const wantComposer = canTalk ? 'on' : 'off';
  if (slot.dataset.state !== wantComposer) {
    slot.dataset.state = wantComposer;
    slot.innerHTML = canTalk
      ? `<form class="composer" id="composer"><input id="msgInput" placeholder="메시지 보내기" autocomplete="off" maxlength="500" aria-label="메시지"><button id="sendBtn" aria-label="보내기" disabled>${I.send}</button></form>`
      : `<div class="locked">${i.deleted ? '삭제된 글이라 채팅할 수 없어요.' : i.status === 'done' ? '거래가 끝난 채팅방이에요.' : '다른 분과 예약중인 물건이라 채팅할 수 없어요. 찜해 두면 거래 취소 시 순서대로 연락할 수 있어요.'}</div>`;
    if (canTalk) {
      const inp = $('#msgInput'), btn = $('#sendBtn');
      inp.addEventListener('input', () => { btn.disabled = !inp.value.trim(); });
      $('#composer').addEventListener('submit', async e => {
        e.preventDefault(); const text = inp.value.trim(); if (!text) return;
        inp.value = ''; btn.disabled = true;
        try { await sendMsg(r, me.uid, text); } catch (err) { toast('보내지 못했어요', err.message); inp.value = text; }
        inp.focus();
      });

  }

async function sendMsg(r, from, text) {
  const at = now();
  await store.add('messages', { roomId: r.id, from, text, at });
  await store.set('rooms', r.id, { lastMsg: text, lastFrom: from, lastBy: me.uid, updatedAt: at });
}

async function ensureRoom(item, buyer) {
  const id = roomIdFor(item.id, buyer.uid);
  const exists = S.rooms.find(r => r.id === id);
  const base = exists || {
    itemId: item.id, itemTitle: item.title,
    sellerUid: item.sellerUid, sellerName: item.sellerName, sellerSid: item.sellerSid,
    buyerUid: buyer.uid, buyerName: buyer.name, buyerSid: buyer.sid,
    dealAt: null, createdAt: now(), updatedAt: now(), lastMsg: '', lastFrom: ''
  };
  if (!exists) { await store.set('rooms', id, base); if (!S.rooms.some(r => r.id === id)) S.rooms.push({ id, ...base }); }
  return { id, ...base };
}

/* ---------------- 프로필 시트 ---------------- */
function sheet(html, mount) {
  const el = document.createElement('div');
  el.className = 'scrim';
  el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  const close = () => el.remove();
  el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) close(); });
  document.body.appendChild(el);
  mount && mount(el, close);
  return close;
}
function confirmSheet(title, text, okLabel, danger = false) {
  return new Promise(res => {
    sheet(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="btns"><button class="btn soft" data-close>닫기</button><button class="btn ${danger ? 'ghost' : 'primary'}" id="okBtn" style="${danger ? 'color:var(--danger)' : ''}">${esc(okLabel)}</button></div>`,
      (el, close) => { el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) res(false); }); $('#okBtn', el).onclick = () => { close(); res(true); }; });
  });
}
function profileSheet(reason) {
  return new Promise(res => {
    sheet(`<h3>${reason ? esc(reason) : '내 프로필'}</h3>
      <p>같은 학교 학생끼리 믿고 거래하려고 학번과 이름을 받아요.</p>
      <div class="two"><input class="input" id="p-sid" inputmode="numeric" maxlength="6" placeholder="학번 (예: 20315)" value="${esc(me.sid)}"><input class="input" id="p-name" maxlength="10" placeholder="이름" value="${esc(me.name)}"></div>
      <p class="err" id="p-err" hidden></p>
      <div class="btns"><button class="btn soft" data-close>나중에</button><button class="btn primary" id="p-ok">저장</button></div>`,
      (el, close) => {
        el.addEventListener('click', e => { if (e.target === el || e.target.closest('[data-close]')) res(false); });
        $('#p-ok', el).onclick = () => {
          const sid = $('#p-sid', el).value.trim(), name = $('#p-name', el).value.trim();
          const err = validSid(sid) || (!name ? '이름을 입력해 주세요.' : '');
          if (err) { const p = $('#p-err', el); p.textContent = err; p.hidden = false; return; }
          saveMe({ sid, name }); close(); render(); res(true);

}
const validSid = sid => /^\d{4,6}$/.test(sid) ? '' : '학번은 숫자 4~6자리로 입력해 주세요. (예: 20315)';
async function needProfile(reason) { return hasProfile() || await profileSheet(reason); }

/* ---------------- 후기 추천 ---------------- */
function templateSuggestions(i) {
  const t = i.title.length > 14 ? '좋은 물건' : i.title;
  const seller = i.sellerName;
  const place = i.place || '약속 장소';
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const free = Number(i.price) === 0;
  return [
    pick([`${seller}님 덕분에 기분 좋게 거래했어요. 감사합니다!`, `친절하게 답해 주셔서 편하게 거래했어요.`, `채팅 답장이 빨라서 거래가 금방 끝났어요.`]),
    pick([`약속 시간에 맞춰 ${place}에 나와 주셔서 감사해요.`, `시간 약속을 잘 지켜 주셔서 믿음이 갔어요.`, `쉬는 시간에 맞춰 와 주셔서 편했어요.`]),
    pick([`물건 상태가 설명이랑 똑같았어요. 잘 쓸게요!`, `상태를 꼼꼼하게 알려 주셔서 믿고 받았어요.`, `사진이랑 같은 상태라 만족해요.`]),
    free ? pick([`${t} 나눔해 주셔서 정말 감사해요. 열심히 공부할게요!`, `나눔 감사합니다! 저도 다음에 나눔할게요.`])
         : pick([`좋은 가격에 ${t} 구했어요. 감사합니다!`, `새로 사기 아까웠는데 덕분에 아꼈어요.`]),
    pick([`다음에도 ${seller}님 물건 올라오면 또 거래하고 싶어요.`, `시험 잘 보세요! 좋은 거래 감사했어요.`, `믿고 거래할 수 있는 분이에요. 추천해요!`])
  ];
}
let suggestSeq = 0;
async function loadSuggestions(itemId, again = false) {
  const i = itemById(itemId); const list = $('#aiList'); if (!i || !list) return;
  const seq = ++suggestSeq;
  list.innerHTML = '<div class="skeleton"></div>'.repeat(5);
  let out = null, viaAI = false;
  try {
    const sample = window.claude && window.claude.use ? await Promise.race([window.claude.use('sample'), wait(4000).then(() => null)]) : null;
    if (sample) {
      const prompt = `너는 고등학교 학생끼리 중고 물건을 사고파는 앱의 거래 후기 도우미야.
구매자가 판매자에게 남길 후기 멘트 5개를 추천해 줘.
조건:
- 한국어 존댓말, 각 15~45자, 한 문장 또는 두 문장
- 서로 다른 관점: 친절함 / 시간 약속 / 물건 상태 / ${Number(i.price) === 0 ? '나눔에 대한 감사' : '가격에 대한 만족'} / 다음 거래 의사
- 고등학생이 실제로 쓸 법한 자연스러운 말투, 과장 금지, 이모지는 쓰지 말 것
- 아래 정보에 없는 구체적 사실(필기 여부, 선물 등)은 지어내지 말 것
${again ? '- 흔한 표현 말고 새로운 표현으로\n' : ''}거래 정보: 물건 "${i.title}", 카테고리 "${i.category || '기타'}", ${Number(i.price) === 0 ? '무료 나눔' : won(i.price)}, 직거래 장소 "${i.place || '미정'}", 판매자 이름 "${i.sellerName}"
문자열 5개짜리 JSON 배열만 출력해.`;
      const res = await sample.json(prompt, again ? { modelTier: 'quick', cache: false } : { modelTier: 'quick' });
      if (Array.isArray(res) && res.length >= 3) { out = res.slice(0, 5).map(String); viaAI = true; }
    }
  } catch (e) { /* AI를 쓸 수 없으면 아래 기본 추천으로 */ }
  if (!out) out = templateSuggestions(i);
  if (seq !== suggestSeq || !$('#aiList')) return;
  $('#aiTag').textContent = viaAI ? 'AI 추천' : '추천';
  $('#aiNote').textContent = viaAI ? 'AI가 이 거래에 맞춰 골랐어요. 고르면 아래 칸에 들어가고, 고쳐 써도 돼요.' : '거래 정보에 맞춘 추천 멘트예요. 고르면 아래 칸에 들어가고, 고쳐 써도 돼요.';
  list.innerHTML = out.map((t, k) => `<button type="button" class="ai-opt" data-act="pickRv:${k}">${esc(t)}</button>`).join('');
}

const ACT = {
  tab(name) { go(name); },
  back() { back(); },
  open(id) { go('detail', { id }); },
  chat(id) { go('chat', { id }); },
  review(id) { go('review', { id }); },
  filter(f) { homeState.filter = f; render(); },
  cat(c) { homeState.cat = c; render(); },
  catGo(c) { homeState.cat = c; go('home'); },
  pickCat(c, btn) {
    newFormState.cat = c;
    btn.parentElement.querySelectorAll('.chip').forEach(b => { const on = b === btn; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  },
  meTab(t) { meState.tab = t; render(); },
  async newItem() { go('newItem'); },
  async refresh() { await showLoader(500, () => store.reload()); },
  async bell() {
    const p = prefs();
    if (p.newItemAlert) { setPrefs({ newItemAlert: false }); toast('새 물건 알림을 껐어요'); render(); return; }
    const perm = await askNotifyPermission();
    setPrefs({ newItemAlert: true }); ls.set('dh_tip_closed', true);
    toast('새 물건 알림을 켰어요', perm === 'granted' ? '새 물건이 올라오면 휴대폰·PC 알림으로도 알려 드려요.' : '브라우저 알림이 막혀 있어 화면 안 알림으로 알려 드려요.');
    render();
  },
  pickPhoto() { if (newFormState.photos.length >= 10) return toast('사진은 10장까지 올릴 수 있어요'); $('#photoInput').click(); },
  rmPhoto(k) { newFormState.photos.splice(Number(k), 1); drawPhotos(); },
  priceMode(m) { setPriceMode(m); },
  place(p) { $('#f-place').value = p; },
  mapPick() { mapSheet({ pick: true, highlight: $('#f-place').value.trim() }); },
  mapShow(p) { mapSheet({ highlight: p }); },
  async report(id) {
    const i = itemById(id); if (!i) return;
    if (!await needProfile('신고하려면 프로필이 필요해요')) return;
    if (S.reports.some(r => r.itemId === id && r.reporterUid === me.uid)) return toast('이미 신고한 글이에요', '관리자가 확인 중이에요.');
    reportSheet(i);
  },
  suggest() { suggestSheet(); },
  async submitItem(_, btn) {
    const v = id => $(id).value.trim();
    const title = v('#f-title'), desc = v('#f-desc'), sid = v('#f-sid'), name = v('#f-name'), place = v('#f-place');
    const digits = $('#f-price').value.replace(/\D/g, '');
    const err = !title ? '제목을 입력해 주세요.' : !newFormState.cat ? '카테고리를 골라 주세요.' : !desc ? '자세한 설명을 입력해 주세요.'
      : (!newFormState.free && digits === '') ? '가격을 입력하거나 ‘나눔하기’를 골라 주세요.'
      : Number(digits) > MAX_PRICE ? `가격은 최대 ${won(MAX_PRICE)}까지예요.`
      : validSid(sid) || (!name ? '이름을 입력해 주세요.' : !place ? '직거래 장소를 입력해 주세요.' : '');
    const box = $('#formErr');
    if (err) { box.textContent = err; box.hidden = false; box.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    box.hidden = true;
    const price = newFormState.free ? 0 : Number(digits);
    if (store.mode === 'firebase' && JSON.stringify(newFormState.photos).length > 900000) { box.textContent = '사진 용량이 너무 커요. 사진 수를 줄여 주세요.'; box.hidden = false; return; }
    saveMe({ sid, name });
    btn.disabled = true; btn.textContent = '올리는 중…';
    try {
      const list = newFormState.photos;
      const thumb = list.length ? await shrink(list[0], 240, 0.7) : '';
      const id = await store.add('items', {
        title, desc, price, thumb, photoCount: list.length, place, category: newFormState.cat,
        sellerUid: me.uid, sellerName: name, sellerSid: sid,
        status: 'selling', reservedUid: null, buyerUid: null, wishers: [], createdAt: now()
      });
      if (list.length) { photoCache[id] = list; await store.set('photos', id, { list }); }
      toast(price === 0 ? '나눔 글을 올렸어요' : '판매 글을 올렸어요', `${josa(title, '이', '가')} 등록되었어요.`);
      stack.splice(0, stack.length, { name: 'home', params: {} }, { name: 'detail', params: { id } });
      await wait(50); render(true);
    } catch (e) { box.textContent = e.message; box.hidden = false; btn.disabled = false; btn.textContent = '작성 완료'; }
  },
  async startChat(itemId) {
    const i = itemById(itemId); if (!i) return;
    if (!await needProfile('채팅하려면 프로필이 필요해요')) return;
    if (i.status === 'reserved' && i.reservedUid !== me.uid) return toast('예약중인 물건이에요', '찜해 두면 거래 취소 시 순서대로 채팅할 수 있어요.');
    const r = await ensureRoom(i, me);
    go('chat', { id: r.id });
  },
  async wish(itemId) {
    const i = itemById(itemId); if (!i) return;
    if (!await needProfile('찜하려면 프로필이 필요해요')) return;
    const list = i.wishers || [];
    const on = list.some(w => w.uid === me.uid);
    const next = on ? list.filter(w => w.uid !== me.uid) : [...list, { uid: me.uid, name: me.name, sid: me.sid, at: now() }];
    await store.set('items', itemId, { wishers: next });
    if (!on) {
      const pos = next.length;
      toast('찜했어요', i.status === 'reserved' ? `대기 ${pos}번째예요. 거래가 취소되면 순서대로 채팅이 열려요.` : '내 정보 › 찜에서 다시 볼 수 있어요.');
    }
  },
  async deleteItem(id) {
    if (!await confirmSheet('이 글을 지울까요?', '지우면 되돌릴 수 없어요. 채팅방도 더 이상 쓸 수 없어요.', '삭제', true)) return;
    await store.del('items', id); await store.del('photos', id); toast('글을 지웠어요'); go('home');
  },
  async reserve(roomId) {
    const r = S.rooms.find(x => x.id === roomId); const i = itemById(r.itemId);
    if (!await confirmSheet(`${r.buyerName}님과 예약할까요?`, '예약중이 되면 다른 사람은 이 물건으로 채팅할 수 없고, 찜만 할 수 있어요.', '예약하기')) return;
    await store.set('items', i.id, { status: 'reserved', reservedUid: r.buyerUid });
    await sysMsg(r, `${r.sellerName}님이 ${r.buyerName}님과의 거래를 예약했어요.`);
  },
  async complete(roomId) {
    const r = S.rooms.find(x => x.id === roomId); const i = itemById(r.itemId);
    if (!await confirmSheet('거래를 완료할까요?', `${r.buyerName}님과 거래가 끝났다고 표시해요. 두 사람의 내 정보 › 거래 기록에 남고, 구매자에게 후기 작성을 안내해요.`, '거래완료')) return;
    const at = now();
    await store.set('items', i.id, { status: 'done', buyerUid: r.buyerUid, buyerName: r.buyerName, reservedUid: null, doneAt: at });
    await store.set('deals', i.id, {
      itemId: i.id, title: i.title, price: i.price, category: i.category || '기타', place: i.place || '',
      sellerUid: i.sellerUid, sellerName: i.sellerName, sellerSid: i.sellerSid,
      buyerUid: r.buyerUid, buyerName: r.buyerName, buyerSid: r.buyerSid, at
    });
    await sysMsg(r, `거래가 완료되었어요. ${r.buyerName}님, 후기를 남겨 주세요!`);
  },
  async cancelDeal(roomId) {
    const r = S.rooms.find(x => x.id === roomId); const i = itemById(r.itemId);
    const queue = [...(i.wishers || [])].filter(w => w.uid !== r.buyerUid).sort((a, b) => a.at - b.at);
    const msg = queue.length ? `예약을 취소하면 찜 1순위인 ${queue[0].name}님에게 바로 채팅이 열려요.` : '예약을 취소하면 다시 판매중이 되어 누구나 채팅할 수 있어요.';
    if (!await confirmSheet('예약을 취소할까요?', msg, '예약 취소', true)) return;
    await store.set('rooms', r.id, { dealAt: null });
    await sysMsg(r, `${me.name || '참여자'}님이 예약을 취소했어요.`);
    if (queue.length) {
      const nextUser = queue[0];
      await store.set('items', i.id, { status: 'reserved', reservedUid: nextUser.uid, wishers: queue.slice(1) });
      const r2 = await ensureRoom({ ...i }, nextUser);
      await sysMsg(r2, `앞선 거래가 취소되어 찜 1순위인 ${nextUser.name}님께 채팅이 열렸어요. 판매자와 바로 대화해 보세요.`);
    } else {
      await store.set('items', i.id, { status: 'selling', reservedUid: null });
    }
  },
  async saveDeal(roomId) {
    const r = S.rooms.find(x => x.id === roomId); const val = $('#dealInput').value;
    if (!val) return toast('날짜와 시간을 골라 주세요');
    const t = new Date(val).getTime();
    if (isNaN(t)) return toast('날짜를 다시 골라 주세요');
    if (t <= now()) return toast('이미 지난 시간이에요', '앞으로의 시간을 골라 주세요.');
    if (t > now() + MAX_DEAL_DAYS * 864e5) return toast('너무 먼 날짜예요', `거래 약속은 오늘부터 ${MAX_DEAL_DAYS}일 안으로만 잡을 수 있어요.`);
    await store.set('rooms', r.id, { dealAt: t });
    const i = itemById(r.itemId);
    await sysMsg(r, `거래 약속: ${dealLabel(t)}${i?.place ? ` · ${i.place}` : ''}\n약속 10분 전에 두 분께 알림을 보내요.`);
  },
  pickRv(k, btn) {
    document.querySelectorAll('.ai-opt').forEach(b => b.classList.toggle('on', b === btn));
    $('#rv-text').value = btn.textContent; $('#rv-text').focus();
  },
  regen(id) { loadSuggestions(id, true); },
  async submitReview(itemId) {
    const i = itemById(itemId); const text = $('#rv-text').value.trim();
    if (text.length < 5) { const e = $('#rvErr'); e.textContent = '후기를 5자 이상 써 주세요.'; e.hidden = false; return; }
    await store.add('reviews', { itemId, itemTitle: i.title, fromUid: me.uid, fromName: me.name, toUid: i.sellerUid, text, at: now() });
    toast('후기를 보냈어요', `${i.sellerName}님에게 전해졌어요.`); back();
  },
  async editProfile() { await profileSheet(); },
  async switchUser(uid) {
    if (uid === 'self') { if (!DEMO_USERS.some(u => u.uid === me.uid)) return; me = ls.get('dh_me_self', null) || ls.get('dh_me', null) || { uid: 'u_' + newId(), sid: '', name: '' }; ss.set('dh_me', me); }
    else {
      if (!DEMO_USERS.some(u => u.uid === me.uid)) ls.set('dh_me_self', me);
      me = { ...DEMO_USERS.find(u => u.uid === uid) }; ss.set('dh_me', me);
    }
    prevRooms = null; onRoomsChanged(S.rooms);
    toast(`${me.name || '내 계정'}(으)로 바꿨어요`, '이 탭에서만 바뀌어요.'); render();
  },
  async resetDemo() {
    if (!await confirmSheet('시연 데이터를 모두 지울까요?', '이 브라우저에 저장된 물건, 채팅, 후기, 거래 기록이 모두 지워져요.', '모두 지우기', true)) return;
    store.reset(); ls.set('dh_fired', {}); go('home');
  }
};

/* =====================================================================
   로딩 (로고 회전)
   ===================================================================== */
async function showLoader(minMs, task) {
  const l = $('#loader'); const btn = $('#refreshBtn');
  l.classList.remove('boot', 'hide'); l.hidden = false; btn && btn.classList.add('spinning');
  const t0 = now();
  try { await task(); } catch (e) { toast('새로고침 실패', e.message); }
  await wait(Math.max(0, minMs - (now() - t0)));
  l.classList.add('hide'); setTimeout(() => { l.hidden = true; }, 260);
  const b2 = $('#refreshBtn'); b2 && b2.classList.remove('spinning');
}

/* =====================================================================
   시작
   ===================================================================== */
async function boot() {
  const t0 = now();
  try { store = FIREBASE_CONFIG ? await firebaseStore(FIREBASE_CONFIG) : localStore(); }
  catch (e) { store = localStore(); toast('Firebase에 연결하지 못했어요', '시연 모드로 열었어요. 설정값을 확인해 주세요.'); }
  if (store.mode === 'local' && !ls.get('dh_purged_v2', false)) { store.purgeDemo(); ls.set('dh_purged_v2', true); }
  let itemsDone; const itemsReady = new Promise(r => { itemsDone = r; });
  const ready = new Promise(res => {
    const done = k => { S.loaded[k] = true; if (k === 'items') itemsDone(); if (Object.values(S.loaded).every(Boolean)) res(); };
    store.watch('items', l => { S.items = l; onItemsChanged(l); done('items'); render(); });
    store.watch('reports', l => { S.reports = l; render(); });
    store.watch('rooms', l => { S.rooms = l; onRoomsChanged(l); done('rooms'); render(); checkDealReminders(); });
    store.watch('reviews', l => { S.reviews = l; done('reviews'); render(); });
    store.watch('deals', l => { S.deals = l; done('deals'); render(); });
  });
  /* 물건 목록만 오면 바로 보여 주고, 나머지는 뒤에서 이어 받기 */
  await Promise.race([itemsReady, wait(8000)]);
  render(true);
  const l = $('#loader'); l.classList.add('hide'); setTimeout(() => { l.hidden = true; }, 260);
  setInterval(() => { checkDealReminders(); if (current().name === 'home' && document.activeElement?.id !== 'q') render(); }, 20000);
}
boot();
</script>
